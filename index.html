<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graifxy | خلفيات موبايل فاخرة</title>
<meta name="description" content="Graifxy: مجموعة منتقاة من خلفيات الموبايل بجودة عالية، تُحمَّل بالمقاس الأصلي.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Readex+Pro:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0b0d;--panel:#151316;--ink:#efeae3;--dim:#8e8a87;--acc:#cdb98f;--line:#ffffff22}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:300 16px/1.8 "Readex Pro",Tahoma,sans-serif}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:4px}

.hero{max-width:1240px;margin:auto;padding:56px 28px 40px;display:grid;gap:48px;align-items:center;grid-template-columns:1.25fr 1fr}
.mark{font:300 clamp(64px,12vw,148px)/.95 "Cormorant Garamond",serif;letter-spacing:.03em;direction:ltr;text-align:right}
.hero h1{font-weight:200;font-size:clamp(22px,3vw,34px);line-height:1.6;margin-top:28px;max-width:16em}
.hero p{color:var(--dim);margin-top:14px;max-width:26em}
.arch{justify-self:center;width:min(340px,80%);aspect-ratio:3/4;border-radius:999px 999px 0 0;overflow:hidden;background:var(--panel);box-shadow:0 0 0 10px var(--bg),0 0 0 11px var(--acc);animation:rise 1.4s ease both}
.arch img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity 1s}
.arch img.on{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:36px;gap:40px}.mark{text-align:center}.hero h1,.hero p{margin-inline:auto;text-align:center}}

.tools{max-width:1240px;margin:auto;padding:0 28px;display:flex;gap:28px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:22px}
.cats{display:flex;gap:26px;overflow-x:auto;padding-bottom:6px}
.cat{color:var(--dim);white-space:nowrap;padding:6px 0;border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
.cat:hover{color:var(--ink)}
.cat.on{color:var(--acc);border-color:var(--acc)}
#q{background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;padding:6px 2px;width:220px}
#q::placeholder{color:var(--dim)}

main{max-width:1240px;margin:auto;padding:36px 28px 80px}
.grid{display:grid;gap:26px 22px;grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}.card:nth-child(4n+2),.card:nth-child(4n+4){margin-top:48px}}
.card{position:relative;display:block;width:100%;padding:0;aspect-ratio:2/3;overflow:hidden;background:var(--panel)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.card:hover img,.card:focus-visible img{transform:scale(1.05)}
.card span{position:absolute;inset:auto 0 0;padding:40px 14px 12px;font-size:13px;text-align:start;background:linear-gradient(transparent,#000c);opacity:0;transition:opacity .4s}
.card:hover span,.card:focus-visible span{opacity:1}
.msg{color:var(--dim);border:1px solid var(--line);padding:22px;margin-bottom:26px}
.more{display:block;margin:64px auto 0;padding:14px 44px;border:1px solid var(--acc);color:var(--acc);transition:background .3s,color .3s}
.more:hover{background:var(--acc);color:var(--bg)}

dialog{border:0;background:var(--bg);color:var(--ink);width:min(920px,94vw);max-height:94vh;margin:auto;padding:40px 32px}
dialog::backdrop{background:#000d}
.view{display:flex;gap:48px;align-items:center;justify-content:center;flex-wrap:wrap}
.phone{width:min(250px,64vw);aspect-ratio:9/19;border:1px solid var(--acc);border-radius:38px;padding:7px}
.screen{width:100%;height:100%;border-radius:30px;background-size:cover;background-position:center;color:#fff;text-align:center;text-shadow:0 2px 14px #0008}
.screen b{display:block;padding-top:50px;font:300 58px/1 "Cormorant Garamond",serif}
.info{flex:1;min-width:230px}
.info h2{font-weight:200;font-size:24px;line-height:1.5}
.info p{color:var(--dim);margin:10px 0 26px;font-size:14px}
.info p a{color:var(--acc);text-underline-offset:4px}
.dl{display:inline-block;padding:14px 32px;background:var(--acc);color:#1b1608;text-decoration:none;font-weight:400}
.x{display:block;margin-top:22px;color:var(--dim)}

footer{border-top:1px solid var(--line);text-align:center;color:var(--dim);padding:32px;font-size:14px}
footer b{font:500 20px "Cormorant Garamond",serif;letter-spacing:.06em;color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="hero">
  <div>
    <div class="mark">Graifxy</div>
    <h1>خلفيات تليق بشاشتك، بجودة لا تُساوَم</h1>
    <p>مجموعة منتقاة بعناية، تُحمَّل بالمقاس الأصلي.</p>
  </div>
  <div class="arch"><img id="hero" alt=""></div>
</section>

<div class="tools">
  <nav class="cats" id="cats" aria-label="التصنيفات"></nav>
  <input id="q" type="search" placeholder="ابحث عن خلفية" aria-label="بحث">
</div>

<main>
  <div id="note"></div>
  <div class="grid" id="grid"></div>
  <!-- مكان إعلان AdSense: ضع كود الإعلان هنا بعد قبول موقعك -->
  <button class="more" id="more" hidden>عرض المزيد</button>
</main>

<dialog id="dlg">
  <div class="view">
    <div class="phone"><div class="screen" id="ph"><b id="clk">9:41</b></div></div>
    <div class="info">
      <h2 id="ttl"></h2>
      <p>تصوير <a id="by" target="_blank" rel="noopener"></a> عبر <a href="https://www.pexels.com" target="_blank" rel="noopener">Pexels</a><br><span id="sz"></span></p>
      <a class="dl" id="dl" target="_blank" rel="noopener">تحميل بالجودة الأصلية</a>
      <button class="x" id="close">إغلاق</button>
    </div>
  </div>
</dialog>

<footer><b>Graifxy</b><br>الصور من <a href="https://www.pexels.com" target="_blank" rel="noopener">Pexels</a></footer>

<script>
// ضع مفتاحك المجاني من https://www.pexels.com/api/ هنا
const KEY = "BcjPntHMB8wiWyJ109FQ4afwX3hkyeL18dSReQLT6SUFTpX8zmjWqGNq";
const CATS = {"الكل":"","طبيعة":"nature","مدينة":"city night","فضاء":"space galaxy","سيارات":"luxury cars","بحر":"ocean","جبال":"mountains","مينيمال":"minimal","ألوان":"abstract gradient"};
const $ = id => document.getElementById(id);
let query = "", page = 1, heroSet = false;

$("cats").innerHTML = Object.keys(CATS).map((c,i)=>`<button class="cat${i?"":" on"}" data-c="${c}">${c}</button>`).join("");
$("cats").onclick = e => {
  const b = e.target.closest(".cat"); if(!b) return;
  document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("on",x===b));
  $("q").value = ""; start(CATS[b.dataset.c]);
};
$("q").onkeydown = e => { if(e.key==="Enter"){ const v=$("q").value.trim(); if(v){ document.querySelectorAll(".cat").forEach(x=>x.classList.remove("on")); start(v); } } };
$("more").onclick = () => { page++; load(); };

function start(q){ query=q; page=1; $("grid").innerHTML=""; load(); }

async function load(){
  if(!KEY){ $("note").innerHTML='<div class="msg">للتشغيل: احصل على مفتاح Pexels API المجاني وضعه في المتغير KEY داخل الملف.</div>'; return; }
  $("note").innerHTML=""; $("more").hidden=true;
  const url = query
    ? `https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&orientation=portrait&size=large&per_page=24&page=${page}`
    : `https://api.pexels.com/v1/curated?per_page=24&page=${page}`;
  try{
    const r = await fetch(url,{headers:{Authorization:KEY}});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    if(!d.photos.length && page===1){ $("note").innerHTML='<div class="msg">لا توجد نتائج. جرّب كلمة أخرى.</div>'; return; }
    if(!heroSet && d.photos[0]){ const h=$("hero"); h.src=d.photos[0].src.large; h.onload=()=>h.classList.add("on"); heroSet=true; }
    d.photos.forEach(add);
    $("more").hidden = !d.next_page;
  }catch(e){ $("note").innerHTML='<div class="msg">تعذّر التحميل. تأكد من المفتاح وحاول مرة أخرى.</div>'; }
}

function add(p){
  const b = document.createElement("button");
  b.className="card"; b.style.background=p.avg_color;
  const alt=(p.alt||"خلفية").replace(/"/g,"");
  b.innerHTML=`<img loading="lazy" src="${p.src.portrait}" alt="${alt}"><span>${p.photographer}</span>`;
  b.onclick=()=>show(p); $("grid").append(b);
}

function show(p){
  $("ph").style.backgroundImage=`url(${p.src.large})`;
  $("ttl").textContent=p.alt||"خلفية";
  $("by").textContent=p.photographer; $("by").href=p.photographer_url;
  $("dl").href=p.src.original; $("sz").textContent=`المقاس الأصلي ${p.width}×${p.height}`;
  $("clk").textContent=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  $("dlg").showModal();
}
$("close").onclick=()=>$("dlg").close();
$("dlg").onclick=e=>{ if(e.target===$("dlg")) $("dlg").close(); };

start("");
</script>
</body>
</html>
